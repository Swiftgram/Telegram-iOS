name: Build Eblogram IPA

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Standalone for Sideloadly, or full with App Group extensions
        type: choice
        default: standalone
        options:
          - standalone
          - full

permissions:
  contents: read

concurrency:
  group: eblogram-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Checkout fork with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 1

      - name: Check environment
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          python3 --version
          git submodule status --recursive

      - name: Verify patch in this fork
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_local_features.py . --check-only
          grep -q 'public var localFeaturesEnabled: Bool' Swiftgram/SGStatus/Sources/SGStatus.swift
          grep -q 'immediateSGStatus.localFeaturesEnabled' Swiftgram/SGTelegramUIExtensions/Sources/SGTelegramUIExtensions.swift

      - name: Write local development config
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          EBLOGRAM_VARIANT: ${{ inputs.variant }}
        run: python3 scripts/make_config.py

      - name: Check fake provisioning profile dates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_fake_profiles.py

      - name: Import fake signing certificates
        run: python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Build IPA for later re-signing
        shell: bash
        run: |
          set -euo pipefail
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot=/private/var/tmp/_bazel_containerhost \
            build \
            --configurationPath=build-input/local-unsigned-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="${GITHUB_RUN_NUMBER}" \
            --outputBuildArtifactsPath=build/artifacts
      - name: Check IPA layout before re-signing
        env:
          EBLOGRAM_VARIANT: ${{ inputs.variant }}
        run: python3 scripts/check_eblogram_ipa.py build/artifacts/Eblogram.ipa --variant "$EBLOGRAM_VARIANT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eblogram-${{ inputs.variant }}-IPA
          path: build/artifacts/Eblogram.ipa
          if-no-files-found: error
          retention-days: 7
