name: Build unsigned IPA

# Produces an unsigned device build (Swiftgram.ipa) on a macOS runner.
# Requires a runner with Xcode 27.1 (the version pinned in versions.json) and
# roughly 40 GB of free disk space; a full cold build takes hours.
#
# Manual run: Actions -> "Build unsigned IPA" -> Run workflow.
# Self-hosted Mac: set "runner" to your runner's label (for example self-hosted).

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (macos-26, macos-15, self-hosted, ...)"
        required: false
        default: "macos-26"
        type: string
      xcode:
        description: "Xcode version, for example 27.1 (empty = newest installed)"
        required: false
        default: ""
        type: string
      release:
        description: "Also publish the IPA as a GitHub Release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "build-*"

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Report environment
        run: |
          sw_vers
          df -h /
          xcodebuild -version || true
          python3 --version

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode }}
        run: |
          set -euo pipefail
          if [ -n "${XCODE_VERSION}" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          else
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
            if [ -z "${XCODE_APP}" ]; then
              echo "No Xcode found in /Applications" >&2
              exit 1
            fi
            sudo xcode-select -s "${XCODE_APP}"
          fi
          xcodebuild -version

      - name: Free disk space
        run: |
          set -euo pipefail
          SELECTED_APP="$(xcode-select -p | sed 's|/Contents/Developer||')"
          for app in /Applications/Xcode*.app; do
            if [ "${app}" != "${SELECTED_APP}" ]; then
              sudo rm -rf "${app}"
            fi
          done
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData" 2>/dev/null || true
          df -h /

      - name: Build unsigned IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euxo pipefail
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$HOME/bazel-root" \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath=build/artifacts
          ls -lh build/artifacts

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-unsigned-ipa
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Unsigned IPA build ${{ github.run_number }}
          files: build/artifacts/*
          generate_release_notes: false
