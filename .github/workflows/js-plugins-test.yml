name: JS plugins tests

on:
  push:
    paths:
      - "Swiftgram/JSPlugins/**"
  pull_request:
    paths:
      - "Swiftgram/JSPlugins/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Swiftgram/JSPlugins
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prelude tests
        run: node --test Swiftgram/JSPlugins/tests/prelude.test.js
      - name: Example plugins are valid JavaScript
        run: for f in Swiftgram/JSPlugins/examples/*.js; do node --check "$f"; done
