name: LupinGram iOS (unsigned IPA)

on:
  push:
    branches: [ "claude/gifted-rubin-nzkrec" ]
  workflow_dispatch:

env:
  BAZEL_CACHE_DIR: ~/telegram-bazel-cache

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Check secrets
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::Add repository secrets TG_API_ID and TG_API_HASH (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          df -h / | tail -1
          sysctl -n hw.memsize hw.ncpu

      - name: Write build configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          import json, os
          cfg = {
              "bundle_id": "com.lupingram.app",
              "api_id": os.environ["TG_API_ID"],
              "api_hash": os.environ["TG_API_HASH"],
              "team_id": "XXXXXXXXXX",
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "tg",
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False,
              "sg_config": "",
          }
          json.dump(cfg, open("build-system/lupingram-configuration.json", "w"), indent=2)
          PY

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ~/telegram-bazel-cache
          key: lupingram-bazel-${{ github.run_id }}
          restore-keys: |
            lupingram-bazel-

      - name: Build unsigned IPA
        run: |
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir ~/telegram-bazel-cache \
            build \
            --configurationPath build-system/lupingram-configuration.json \
            --codesigningInformationPath build-system/fake-codesigning \
            --disableProvisioningProfiles \
            --configuration release_arm64 \
            --buildNumber ${{ github.run_number }} \
            --outputBuildArtifactsPath build/artifacts

      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/telegram-bazel-cache
          key: lupingram-bazel-${{ github.run_id }}

      - name: Show build tail on failure
        if: failure()
        run: ls -la build/artifacts 2>/dev/null || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LupinGram-unsigned-ipa
          path: build/artifacts/*.ipa
